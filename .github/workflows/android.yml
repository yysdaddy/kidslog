name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'web/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build web
        working-directory: web
        run: |
          npm config set registry https://registry.npmjs.org
          sed -i 's#https://registry.npmmirror.com#https://registry.npmjs.org#g' package-lock.json
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Sync Capacitor project
        working-directory: mobile
        run: |
          mkdir -p www
          find www -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -rf ../web/dist/. www/
          npm config set registry https://registry.npmjs.org
          sed -i 's#https://registry.npmmirror.com#https://registry.npmjs.org#g' package-lock.json
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          # cap sync = copy + update，负责生成 capacitor-cordova-android-plugins/cordova.variables.gradle
          npx cap sync android

      - name: Configure release signing
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，本次使用 debug 签名出包"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/kidslog-release.jks
          {
            echo "storeFile=keystore/kidslog-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "已写入 release 签名配置"

      - name: Build release APK
        working-directory: mobile/android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' mobile/android/app/build.gradle | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/kidslog-${VERSION}.apk"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidslog-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: KidsLog Android ${{ github.ref_name }}
          body: |
            Capacitor 版本安卓安装包。
            - 首启或「我的 → 服务器设置」填写服务地址
            - 物理返回键优先关闭弹层
          fail_on_unmatched_files: true
