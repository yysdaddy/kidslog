name: Release Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（默认 latest）"
        required: false
        default: latest

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.tag }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          v="${v:-latest}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "镜像标签: $v"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出拉取地址
        run: |
          {
            echo "### 镜像已发布"
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
            echo "docker pull ${{ env.IMAGE }}:latest"
            echo '```'
            echo "若需匿名拉取，请在包设置中把可见性改为 public：https://github.com/users/${{ github.repository_owner }}/packages/container/kidslog/settings"
          } >> "$GITHUB_STEP_SUMMARY"
