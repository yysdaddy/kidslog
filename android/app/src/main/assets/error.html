<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>连接失败</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f8fafc; color: #111827; padding: 24px;
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  .card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 28px 22px;
    box-shadow: 0 6px 24px rgba(15, 23, 42, .08); }
  .ico { width: 56px; height: 56px; border-radius: 50%; background: #fee2e2; color: #dc2626;
    display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 16px; }
  h1 { font-size: 19px; text-align: center; margin: 0 0 8px; font-weight: 600; }
  .sub { text-align: center; color: #6b7280; font-size: 13px; line-height: 1.6; margin: 0 0 18px; }
  .box { background: #f1f5f9; border-radius: 10px; padding: 12px 14px; font-size: 12px;
    color: #475569; word-break: break-all; line-height: 1.7; }
  .box b { color: #334155; font-weight: 600; }
  .box .url { color: #2563eb; }
  .actions { margin-top: 20px; display: grid; gap: 10px; }
  button { width: 100%; border: 0; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 600; }
  .primary { background: #2563eb; color: #fff; }
  .ghost { background: #eef2ff; color: #1d4ed8; }
  .tip { margin-top: 16px; font-size: 12px; color: #9ca3af; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="ico">!</div>
  <h1>无法连接服务器</h1>
  <p class="sub">请检查手机网络、服务器状态，或确认地址是否正确。</p>
  <div class="box">
    <div><b>当前地址</b> <span class="url" id="srv">—</span></div>
    <div><b>失败页面</b> <span class="url" id="url">—</span></div>
    <div id="reasonWrap"><b>原因</b> <span id="reason">—</span></div>
  </div>
  <div class="actions">
    <button class="primary" onclick="go('kidslog://retry')">重试</button>
    <button class="ghost" onclick="go('kidslog://settings')">修改服务器地址</button>
  </div>
  <div class="tip">进入应用后长按返回键，也可随时修改服务器地址。</div>
</div>
<script>
  function q(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    if (!m) return '';
    try { return decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return ''; }
  }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var srv = q('s'), url = q('u'), msg = q('m');
  document.getElementById('srv').textContent = srv || '未配置';
  document.getElementById('url').textContent = url || '—';
  if (msg) { document.getElementById('reason').textContent = msg; }
  else { document.getElementById('reasonWrap').style.display = 'none'; }
  function go(u) { location.href = u; }
</script>
</body>
</html>
